<script>
/* App Android (APK): dentro de la app no existe el menú de compartir del navegador; se usa el puente EventosApp */
(function(){
  var A=window.EventosApp; if(!A) return;
  document.documentElement.classList.add('en-app');
  var b64=function(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(',')[1]||'')};r.onerror=function(){no(new Error('No se pudo leer el archivo'))};r.readAsDataURL(blob);});};
  var aviso=function(m){try{toast(m,3500)}catch(e){}};
  navigator.canShare=function(){return true};
  navigator.share=async function(d){
    var f=d&&d.files&&d.files[0]; if(!f) throw new Error('Nada para compartir');
    var r=A.compartir(await b64(f),f.name||'archivo',f.type||'application/octet-stream',(d&&d.text)||'');
    if(r!=='ok') throw new Error(r);
  };
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[download]'):null; if(!a) return;
    e.preventDefault();e.stopPropagation();
    var nombre=a.getAttribute('download')||'archivo';
    fetch(a.href).then(function(r){return r.blob()}).then(async function(blob){
      var tipo=(blob.type||'application/octet-stream').split(';')[0];
      var r=A.guardar(await b64(blob),nombre,tipo);
      if(r==='galeria') aviso('Imagen guardada en la galería');
      else if(r==='descargas') aviso('Guardado en Descargas › Eventos VM');
      else if(r!=='compartido') aviso('No se pudo guardar: '+r);
    }).catch(function(){aviso('No se pudo guardar el archivo')});
  },true);
  window.print=function(){A.imprimir()};
  var barra=function(){var m=document.querySelector('meta[name=theme-color]');if(m&&m.content)A.barra(m.content)};
  var m=document.querySelector('meta[name=theme-color]');
  if(m) new MutationObserver(barra).observe(m,{attributes:true,attributeFilter:['content']});
  addEventListener('load',barra);
})();
/* Botón «atrás» del teléfono: cierra la ventana abierta, vuelve atrás dentro de la app y solo al final sale */
function atrasApp(){
  try{
    var d=document.getElementById('dlg'); if(d&&d.open){d.close();return 'ok';}
    if(document.getElementById('mcLive')){mcLiveClose();return 'ok';}
    if(typeof S==='undefined'||!document.querySelector('.hbtn')) return 'salir';
    if(S.tab==='doc'){docBack();return 'ok';}
    if(S.tab==='cons'&&S.consTab==='mod'&&S.conMod){S.conMod=null;render();return 'ok';}
    if((S.tab==='con'||S.tab==='inv')&&S.sel){go('ev',S.sel);return 'ok';}
    if(S.sel){go(S.tab);return 'ok';}
    if(S.tab!=='resumen'){go('resumen');return 'ok';}
  }catch(e){}
  return 'salir';
}
</script>

/* Antigüedad de saldos: los abonos se aplican a los cargos más antiguos primero */
function aging(m,id){
  const mv=D[m.mov].filter(x=>x.eid===id).sort(byFecha);
  let cred=sum(mv.filter(x=>x.tipo==='C'));const b=[0,0,0,0];const h=hoy();
  for(const x of mv){if(x.tipo!=='D')continue;let p=x.monto;const ap=Math.min(cred,p);p-=ap;cred-=ap;
    if(p>0){const d=dias(x.fecha,h);b[d<=30?0:d<=60?1:d<=90?2:3]+=p;}}
  return{b,favor:cred};
}
/* Estado con saldo anterior y saldo corrido */
function estado(all,desde,hasta,signo,init=0){
  let ant=init;const rows=[];
  for(const x of all){if(desde&&x.fecha<desde){ant+=signo(x);continue;}if(hasta&&x.fecha>hasta)continue;rows.push({...x});}
  let run=ant;rows.forEach(r=>{run+=signo(r);r._s=run;});return{ant,rows,fin:run};
}

  const upd=()=>F.querySelectorAll('[data-dep]').forEach(l=>{l.style.display=F.elements[l.dataset.dep].value===l.dataset.depv?'':'none';});
  F.addEventListener('change',e=>{upd();const l=F.querySelector('[data-dep="'+e.target.name+'"]');if(l&&l.style.display!=='none')l.querySelector('input').focus();});upd();
  F.onsubmit=e=>{e.preventDefault();const v={};
    for(const f of fields){const el=F.elements[f.n];let x=el.value.trim();
      if(f.dep&&F.elements[f.dep[0]].value!==f.dep[1]){v[f.n]='';continue;}

function listaEv(){

    .map(e=>({e,st:evStats(e.id)})).filter(r=>!S.evPend||r.st.saldo>0).sort((a,b)=>(b.e.fecha||'').localeCompare(a.e.fecha||''));

  $('ef').innerHTML=`<span>${rows.length} eventos</span><span>Valor ${fmt(T('valor'))} · Pagado ${fmt(T('abon'))} · <b class="${T('saldo')>0?'neg':''}">Por pagar ${fmt(T('saldo'))}</b> · Utilidad ${fmt(T('util'))}</span>`;

function evTipo(e){const q=evQ(e.id),t=(q&&q.tipo)||e.nombre||'';return TIPOS.find(x=>sinAc(t).includes(sinAc(x)))||(q&&q.tipo)||'Otro';}
const mgn=(u,v)=>{if(!v)return'<span class="mg">—</span>';const p=u/v*100;return`<span class="mg${p<0?' neg':p<25?' bajo':''}">${p.toFixed(0)}%</span>`;};
function vGan(){
  const yrs=[...new Set([hoy().slice(0,4),...D.eventos.map(e=>(e.fecha||'').slice(0,4)).filter(Boolean)])].sort().reverse(),y=S.ganY||hoy().slice(0,4);
  const E=D.eventos.filter(e=>e.estado!=='Cancelado'&&(e.fecha||'').startsWith(y)).map(e=>{const st=evStats(e.id);return{e,st,v:st.valor+st.otros,t:evTipo(e)};});
  const ven=E.reduce((s,x)=>s+x.v,0),gas=E.reduce((s,x)=>s+x.st.gas,0),gan=ven-gas;
  const gen=sum(igAll().filter(x=>x.tipo==='G'&&!x.evId&&(x.fecha||'').startsWith(y)));
  const MS=['E','F','M','A','M','J','J','A','S','O','N','D'];
  const M=MS.map((_,i)=>{const m=y+'-'+String(i+1).padStart(2,'0'),L=E.filter(x=>x.e.fecha.startsWith(m));return{v:L.reduce((s,x)=>s+x.v,0),g:L.reduce((s,x)=>s+x.st.gas,0)};});
  const mx=Math.max(1,...M.map(x=>Math.max(x.v,x.g))),h=v=>Math.round(v/mx*100);
  const T={};E.forEach(x=>{const o=T[x.t]=T[x.t]||{n:0,v:0,g:0};o.n++;o.v+=x.v;o.g+=x.st.gas;});
  const TL=Object.entries(T).sort((a,b)=>(b[1].v-b[1].g)-(a[1].v-a[1].g));
  const top=E.slice().sort((a,b)=>(b.v-b.st.gas)-(a.v-a.st.gas));
  return`<div class="row sp hd"><h2 class="sec">Ganancias</h2><select onchange="S.ganY=this.value;render()" style="width:auto">${yrs.map(x=>`<option${x===y?' selected':''}>${x}</option>`).join('')}</select></div>
  <div class="cards">
    <div class="card"><div class="k">Vendido en eventos</div><div class="v">${fmt(ven)}</div><div class="s">${E.length} eventos en ${y}</div></div>
    <div class="card"><div class="k">Gastos de los eventos</div><div class="v">${fmt(gas)}</div></div>
    <div class="card"><div class="k">Ganancia de los eventos</div><div class="v ${gan<0?'neg':'pos'}">${fmt(gan)}</div><div class="s">Margen ${mgn(gan,ven)}</div></div>
    <div class="card"><div class="k">Gastos generales</div><div class="v">${fmt(gen)}</div><div class="s">Alquiler, luz, sueldos… sin evento</div></div>
    <div class="card"><div class="k">Ganancia neta</div><div class="v ${gan-gen<0?'neg':''}">${fmt(gan-gen)}</div><div class="s">Ganancia de eventos menos gastos generales</div></div>
  </div>
  <div class="panel"><div class="row sp"><h3 style="margin:0">Mes a mes</h3><div class="gleg"><span><i style="background:var(--pri)"></i>Vendido</span><span><i style="background:var(--gold)"></i>Gastos</span></div></div>
    <div class="gbars">${M.map(x=>`<div class="gb" title="Vendido ${fmt(x.v)} · Gastos ${fmt(x.g)} · Ganancia ${fmt(x.v-x.g)}"><i class="v" style="height:${h(x.v)}%"></i><i class="g" style="height:${h(x.g)}%"></i></div>`).join('')}</div>
    <div class="gbl">${MS.map(m=>`<span>${m}</span>`).join('')}</div></div>
  <div class="panel"><h3>Por tipo de evento</h3>${TL.length?TL.map(([t,o])=>`<div class="cob-r"><div class="cob-i" style="cursor:default"><b>${esc(t)}</b><span class="note">${o.n} evento${o.n===1?'':'s'} · vendido ${fmt(o.v)}</span></div><div class="cob-m"><b>${fmt(o.v-o.g)}</b>${mgn(o.v-o.g,o.v)}</div></div>`).join(''):'<p class="note">Sin eventos en este año.</p>'}</div>
  <div class="panel"><h3>Eventos del año</h3>${top.length?top.map(x=>`<div class="cob-r"><div class="cob-i" onclick="go('ev','${x.e.id}')"><b>${esc(x.e.nombre)}</b><span class="note">${esc(cliName(x.e.eid))} · ${esc(fDia(x.e.fecha))}</span><span class="note">Vendido ${fmt(x.v)} · gastos ${fmt(x.st.gas)}</span></div><div class="cob-m"><b class="${x.v-x.st.gas<0?'neg':''}">${fmt(x.v-x.st.gas)}</b>${mgn(x.v-x.st.gas,x.v)}</div></div>`).join(''):'<p class="note">Sin eventos en este año.</p>'}

}
function evForm(id,fdef){
  const ev=id?D.eventos.find(x=>x.id===id):null;
  const cl=D.clientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const f=[{n:'nombre',l:'Evento (ej. Cumpleaños, Boda, XV años)',req:1},
    {n:'cliSel',l:'Cliente',t:'select',o:[...cl.map(c=>[c.id,c.nombre]),['__new','+ Cliente nuevo…']],def:ev?ev.eid:(cl.length?cl[0].id:'__new')},
    {n:'cliente',l:'Nombre del cliente nuevo',req:1,dep:['cliSel','__new']},
    {n:'fecha',l:'Fecha del evento',t:'date',def:fdef||''},{n:'hora',l:'Hora',t:'time'},{n:'invitados',l:'Invitados'},{n:'lugar',l:'Lugar'},{n:'estado',l:'Estado',t:'select',o:['Por realizar','Realizado','Cancelado']},{n:'nota',l:'Notas',t:'area'}];
  f.push({n:'valor',l:ev?'Valor del evento (L)':'Valor del evento (L) — opcional',t:'money',z:1});
  const st0=ev?evStats(ev.id):null;
  form(ev?'Editar evento':'Nuevo evento',f,ev?{...ev,cliSel:ev.eid,cliente:'',valor:st0.valor||''}:null,v=>{
    let c;
    if(v.cliSel==='__new'){c=D.clientes.find(x=>x.nombre.toLowerCase()===v.cliente.toLowerCase());
      if(!c){c={id:uid(),nombre:v.cliente,rtn:'',tel:'',nota:''};D.clientes.push(c);}}
    else c=D.clientes.find(x=>x.id===v.cliSel);
    const valor=v.valor;delete v.valor;delete v.cliente;delete v.cliSel;v.eid=c.id;
    if(ev){if(!evSetValor(ev,valor,c.id))return false;if(ev.eid!==c.id)D.movCli.forEach(m=>{if(m.evId===ev.id)m.eid=c.id;});Object.assign(ev,v);}
    else{const n={id:uid(),creado:Date.now(),...v};D.eventos.push(n);
      if(valor>0)D.movCli.push({id:uid(),creado:Date.now(),eid:c.id,evId:n.id,tipo:'D',fecha:v.fecha||hoy(),doc:'',concepto:'Valor del evento '+v.nombre,monto:valor});
      S.tab='ev';S.sel=n.id;}
  });
  if(ev){const i=$('f_valor');if(i){i.closest('label').insertAdjacentHTML('beforeend','<div class="note" id="valHint" style="margin-top:4px"></div>');
    const upd=()=>{const nv=i.value.trim()===''?0:toC(i.value);$('valHint').innerHTML=isNaN(nv)?'':nv===st0.valor?`Abonado: ${fmt(st0.abon)} · Saldo pendiente: <b>${fmt(st0.saldo)}</b>`:`Antes: ${fmt(st0.valor)} → el saldo pendiente pasa a <b>${fmt(nv-st0.abon)}</b>. Los abonos no cambian.`;};
    i.addEventListener('input',upd);upd();}}
}
/* Cambia el valor del evento ajustando su cargo principal; los demás cargos y los abonos no se tocan */
function evSetValor(ev,nv,eid){
  nv=+nv||0;const cs=D.movCli.filter(m=>m.evId===ev.id&&m.tipo==='D').sort(byFecha),tot=sum(cs);
  if(nv===tot)return true;
  if(!cs.length){if(nv>0)D.movCli.push({id:uid(),creado:Date.now(),eid:eid||ev.eid,evId:ev.id,tipo:'D',fecha:hoy(),doc:'',concepto:'Valor del evento '+ev.nombre,monto:nv,cid:''});return true;}
  const main=cs.find(m=>/^(Valor del evento|Cotización)/.test(m.concepto||''))||cs[0],otros=tot-main.monto,m=nv-otros;
  if(nv===0&&otros===0){D.movCli=D.movCli.filter(x=>x!==main);return true;}
  if(m<=0){$('ferr').textContent=`Este evento tiene otros cargos por ${fmt(otros)}. El valor debe ser mayor; si querés bajarlo más, editá esos cargos en "Cobro al cliente".`;$('f_valor').focus();return false;}
  main.monto=m;return true;
}
function evValor(id){evForm(id);setTimeout(()=>{const i=$('f_valor');if(i){i.scrollIntoView({block:'center'});i.focus();i.select();}},120);}
function delEv(id){
  const e=D.eventos.find(x=>x.id===id);
  if(!confirm(`¿Eliminar el evento "${evLabel(e)}"?\nSus abonos y gastos NO se borran: quedan en la cuenta del cliente y en Ingresos y gastos, solo sin evento.`))return;
  ['movCli','movProv','ig'].forEach(a=>D[a].forEach(x=>{if(x.evId===id)x.evId='';}));
  D.eventos=D.eventos.filter(x=>x.id!==id);save();go('ev');
}

function cotTot(q){const sub=q.items.reduce((s,it)=>s+lineT(it),0);const desc=Math.round(sub*(+q.descPct||0)/100);const base=sub-desc;const isv=q.isv?Math.round(base*0.15):0;const total=base+isv;return{sub,desc,isv,total,ant:Math.round(total*(+q.anticipo||0)/100)};}

  const F=ff('cot');

}

  const F=ff('cot'),q=sinAc(S.buscar).trim();
  const L=D.cotizaciones.filter(c=>(!q||sinAc([c.num,cotCli(c),c.titulo,c.tipo,c.lugar,c.tema].join(' ')).includes(q))&&(!F.est||c.estado===F.est)&&(!F.mes||(c.fechaEv||c.fecha||'').startsWith(F.mes)))
    .sort((a,b)=>b.num.localeCompare(a.num));

  $('cf').innerHTML=`<tr><td>${L.length} ${L.length===1?'cotización':'cotizaciones'}</td><td class="hm"></td><td></td><td class="hm"></td><td class="hm"></td><td class="n">${fmt(L.reduce((s,q)=>s+cotTot(q).total,0))}</td><td class="hm"></td></tr>`;
}
const cotCli=q=>{const c=q.cid&&D.clientes.find(x=>x.id===q.cid);return c?c.nombre:(q.cliente||'');};
function newCot(){
  D.cotSeq=(D.cotSeq||0)+1;
  const q={id:uid(),num:'COT-'+String(D.cotSeq).padStart(4,'0'),fecha:hoy(),validez:15,estado:'Borrador',cliente:'',tel:'',correo:'',tipo:'Cumpleaños',titulo:'',fechaEv:'',hora:'',lugar:'',invitados:'',tema:'',items:[],descPct:0,isv:false,anticipo:50,notas:'',cond:CF().cond,eventoId:'',cid:'',imgs:[],imgShow:true};

}

    <div class="qa-g"><button class="btn pri" onclick="guardarCot('${id}')">${ic('check',16)} Guardar</button><button class="btn wa" onclick="waShare('cot','${id}')">${ic('send',16)} WhatsApp</button>
      ${prev?`<button class="btn" onclick="S.qMode='edit';render()">${ic('edit',16)} Editar</button>`:`<button class="btn" onclick="S.qMode='prev';render();scrollTo(0,0)">${ic('eye',16)} Vista previa</button>`}
      <button class="btn" onclick="savePDF('${id}')">${ic('save',16)} PDF</button><button class="btn" onclick="saveIMG('${id}')">${ic('save',16)} Imagen</button><button class="btn" onclick="saveHTML('${id}')">${ic('save',16)} HTML</button><button class="btn" onclick="printCot()">${ic('doc',16)} Imprimir</button></div>

    <div class="qi qih"><span>Categoría</span><span>Descripción</span><span>Cant.</span><span>Precio unit.</span><span style="text-align:right">Importe</span><span></span></div>
    <div id="qitems">${q.items.map(it=>`<div class="qi"><input class="c" list="dlQCat" placeholder="Categoría" value="${esc(it.cat)}" oninput="qit('${id}','${it.id}','cat',this.value)"><input class="d" placeholder="Descripción del servicio" value="${esc(it.desc)}" oninput="qit('${id}','${it.id}','desc',this.value)"><label class="ql"><span>Cant.</span><input inputmode="decimal" placeholder="Cant." value="${esc(it.cant)}" oninput="qit('${id}','${it.id}','cant',this.value)"></label><label class="ql"><span>Precio unit.</span><input inputmode="decimal" placeholder="Precio" value="${it.precio?num(it.precio):''}" oninput="qit('${id}','${it.id}','precio',this.value)"></label><div class="qt" id="qt_${it.id}">${fmt(lineT(it))}</div><button class="btn sm ghost bad" onclick="qdel('${id}','${it.id}')" title="Quitar">✕</button></div>`).join('')||'<p class="note">Agregá los servicios uno por uno, o usá “Sugerir servicios” para empezar con una lista típica. Un servicio con precio en blanco aparece como “Incluido”.</p>'}</div>
    <button class="btn" onclick="qadd('${id}')" style="margin-top:6px">+ Agregar servicio</button>

    ${(()=>{const fi=fotoItems(q);return`<label class="qfchk${q.fotos?' on':''}" id="qfotos"><input type="checkbox" ${q.fotos?'checked':''} onchange="qs('${id}','fotos',this.checked);this.parentNode.classList.toggle('on',this.checked)"><span><b>Agregar página 2 con fotos de lo que incluye</b><br><span class="note">${fi.length?`${fi.length} de ${q.items.length} servicios tienen foto en el catálogo. Sale en la vista previa, PDF, imagen, HTML y WhatsApp.`:'Ningún servicio de esta cotización tiene foto todavía. Agregá fotos en Servicios › Catálogo.'}</span>${fi.length?`<span class="qfst">${fi.slice(0,8).map(x=>`<img src="${x.c.foto}" alt="">`).join('')}</span>`:''}</span></label>`;})()}</div>

  <div class="panel"><h3>Totales y condiciones de pago</h3><div class="g2">
    ${inp('descPct','Descuento (%)','text','inputmode="decimal"')}${inp('anticipo','Anticipo requerido (%)','text','inputmode="decimal"')}

    <label class="fld" style="display:flex;align-items:center;gap:8px;padding-top:20px"><input type="checkbox" ${q.isv?'checked':''} onchange="qs('${id}','isv',this.checked)"> Agregar ISV (15%)</label></div>
    <div id="qtot" style="max-width:360px;margin-left:auto">${totEd(q)}</div></div>
  <div class="panel"><h3>Mensaje y condiciones</h3>
    <label class="fld"><span>Nota para el cliente (opcional)</span><textarea rows="3" oninput="qs('${id}','notas',this.value)">${esc(q.notas)}</textarea></label>
    <label class="fld"><span>Condiciones · las palabras {anticipo} y {validez} se cambian solas por los números de arriba. No escribás el número junto a ellas.</span><textarea rows="6" oninput="qs('${id}','cond',this.value);condUpd('${id}')">${esc(q.cond)}</textarea></label><div id="qcondw">${condWarn(q)}</div><p class="note" style="margin:6px 0 0">Así sale: anticipo del <b>${esc(q.anticipo)}%</b> · válida por <b>${esc(q.validez)} días</b>. Para cambiarlos, usá los campos de "Totales y condiciones de pago".</p></div>
  ${acts}`;

function cliSel(q){
  if(!q.cid&&q.cliente){const m=D.clientes.find(c=>c.nombre.toLowerCase()===q.cliente.trim().toLowerCase());if(m){q.cid=m.id;saveLater();}}
  const cl=D.clientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)),huerf=!q.cid&&q.cliente;
  return`<label class="fld"><span>Cliente</span><select onchange="qCli('${q.id}',this.value)">
    <option value="">${cl.length?'— Elegí un cliente —':'— Todavía no hay clientes —'}</option>
    ${huerf?`<option value="__old" selected>${esc(q.cliente)} (no está en Clientes)</option>`:''}
    ${cl.map(c=>`<option value="${c.id}"${c.id===q.cid?' selected':''}>${esc(c.nombre)}${c.tel?' · '+esc(c.tel):''}</option>`).join('')}
    <option value="__new">+ Cliente nuevo…</option></select>
    ${huerf?`<button type="button" class="btn sm" style="margin-top:6px" onclick="qCli('${q.id}','__new')">Agregar "${esc(q.cliente)}" a Clientes</button>`:''}</label>`;
}
function qPonCli(q,c){q.cid=c.id;q.cliente=c.nombre;if(c.tel)q.tel=c.tel;if(c.correo)q.correo=c.correo;}
function qCli(qid,v){const q=getQ(qid);
  if(v==='__old')return;
  if(v==='__new'){render();entForm('cli',null,c=>qPonCli(q,c),!q.cid&&q.cliente?{nombre:q.cliente,tel:q.tel,correo:q.correo}:null);return;}
  if(!v){q.cid='';q.cliente='';}else{const c=D.clientes.find(x=>x.id===v);if(c)qPonCli(q,c);}
  save();render();
}
function totEd(q){const t=cotTot(q);const r=(l,v,b)=>`<div class="row sp" style="padding:3px 0"><span class="${b?'':'mut'}">${l}</span>${b?'<b style="font-size:18px">'+fmt(v)+'</b>':'<span>'+fmt(v)+'</span>'}</div>`;
  return r('Subtotal',t.sub)+(t.desc?r(`Descuento (${q.descPct}%)`,-t.desc):'')+(q.isv?r('ISV (15%)',t.isv):'')+'<div style="border-top:1px solid var(--line);margin:4px 0"></div>'+r('Total',t.total,1)+(t.ant?r(`Anticipo (${q.anticipo}%)`,t.ant):'');}
function qs(id,f,v){const q=getQ(id);if(!q)return;if(['descPct','anticipo','validez'].includes(f))v=parseFloat(v)||0;q[f]=v;saveLater();if(q.token)cotPushLater(id);if($('qtot'))$('qtot').innerHTML=totEd(q);}
function qit(id,itId,f,v){const q=getQ(id),it=q.items.find(x=>x.id===itId);if(f==='precio'){const c=toC(v);v=isNaN(c)?0:c;}it[f]=v;saveLater();if(q.token)cotPushLater(id);if($('qt_'+itId))$('qt_'+itId).textContent=fmt(lineT(it));$('qtot').innerHTML=totEd(q);}
function qadd(id){const q=getQ(id);const last=q.items[q.items.length-1];q.items.push({id:uid(),cat:last?last.cat:'',desc:'',cant:1,precio:0});save();render();const ins=document.querySelectorAll('#qitems .d');ins.length&&ins[ins.length-1].focus();}
function qdel(id,itId){const q=getQ(id);q.items=q.items.filter(x=>x.id!==itId);save();render();}
function qtpl(id){const q=getQ(id),g=parseInt(q.invitados)||0;const P=PLANT[q.tipo]||PLANT['_'];
  const M=mesas(g||1);P.forEach(([cat,desc,c])=>q.items.push({id:uid(),cat,desc,cant:c==='i'?(g||1):c==='m8'?M.m8:c==='m4'?M.m4:c==='mt'?M.t:c==='m'?Math.max(1,Math.ceil(g/10)):c==='w'?Math.max(1,Math.ceil(g/15)):c,precio:0}));
  save();render();}
function dupCot(id){const q=getQ(id);D.cotSeq=(D.cotSeq||0)+1;
  const n={...JSON.parse(JSON.stringify(q)),id:uid(),num:'COT-'+String(D.cotSeq).padStart(4,'0'),fecha:hoy(),estado:'Borrador',eventoId:'',imgs:[]};n.items.forEach(i=>i.id=uid());
  D.cotizaciones.push(n);save();go('cot',n.id);}
function delCot(id){const q=getQ(id);if(!confirm(`¿Eliminar la cotización ${q.num}?`))return;imgDelAll(q.imgs);D.cotizaciones=D.cotizaciones.filter(x=>x.id!==id);save();go('cot');}
function convCot(id,auto){
  const q=getQ(id);if(!q.cliente.trim()){if(!auto)alert('Escribí el nombre del cliente antes de convertir la cotización.');return;}
  const t=cotTot(q);
  if(!auto&&!confirm(`Se creará el evento "${q.titulo||q.tipo} – ${q.cliente}" con un valor de ${fmt(t.total)} en la cuenta del cliente. ¿Continuar?`))return;
  let c=(q.cid&&D.clientes.find(x=>x.id===q.cid))||D.clientes.find(x=>x.nombre.toLowerCase()===q.cliente.trim().toLowerCase());
  if(!c){c={id:uid(),nombre:q.cliente.trim(),rtn:'',tel:q.tel||'',correo:q.correo||'',nota:''};D.clientes.push(c);}
  q.cid=c.id;
  const ev={id:uid(),creado:Date.now(),nombre:q.titulo||q.tipo,eid:c.id,fecha:q.fechaEv,hora:q.hora,invitados:q.invitados,lugar:q.lugar,estado:'Por realizar',nota:q.tema||''};
  D.eventos.push(ev);
  if(t.total>0)D.movCli.push({id:uid(),creado:Date.now(),eid:c.id,evId:ev.id,tipo:'D',fecha:hoy(),doc:q.num,concepto:'Cotización '+q.num+' aceptada',monto:t.total,cid:''});
  q.eventoId=ev.id;q.estado='Aceptada';save();if(!auto)go('ev',ev.id);
}
/* Enlace para que el cliente vea y acepte la cotización desde su teléfono */
function cotSnap(q){const c=CF(),cfg={};['eslogan','tel','correo','dir','rtn','logo','estilo','gracias','fuentes','tema'].forEach(k=>cfg[k]=c[k]);
  return{neg:D.negocio,cfg,tema:c.tema,q:{...JSON.parse(JSON.stringify(q)),imgs:[],fotos:false,token:'',acepto:null}};}
let _cotT={};
function cotPushLater(id){clearTimeout(_cotT[id]);_cotT[id]=setTimeout(()=>{const q=getQ(id);if(!CLOUD||!q||!q.token||q.acepto)return;
  licCall('pubCrear',{items:[{token:q.token,tipo:'cot',ref:'cot:'+id,datos:cotSnap(q)}]}).catch(()=>{});},2500);}
async function cotLink(id){
  const q=getQ(id),send=tok=>{const link=pubURL('k',tok);
    openWA(`https://wa.me/${telWA(q.tel)}?text=${encodeURIComponent(`Hola ${q.cliente||''} 👋\nLe compartimos la cotización *${q.num}* para su ${(q.titulo||q.tipo).toLowerCase()}${q.fechaEv?' del '+fLarga(q.fechaEv):''}.\nTotal: *${fmt(cotTot(q).total)}*\n\nPuede verla y aceptarla desde su teléfono aquí:\n${link}\n\n${D.negocio}`)}`);};
  if(!CLOUD){toast('Para enviar la cotización por enlace se necesita la versión en la nube.',4000);return;}
  if(!q.cliente.trim()){toast('Escribí el nombre del cliente primero');return;}
  toast('Preparando enlace…',0);
  try{const r=await licCall('pubCrear',{items:[{token:q.token||'',tipo:'cot',ref:'cot:'+id,datos:cotSnap(q)}]});hideToast();
    if(!(r&&r.ok&&r.tokens&&r.tokens[0]))throw new Error((r&&r.msg)||'');
    q.token=r.tokens[0];if(q.estado==='Borrador')q.estado='Enviada';save();render();
    toastAct('✓ Enlace para aceptar listo','Abrir WhatsApp',()=>send(q.token));
  }catch(err){hideToast();toast('No se pudo crear el enlace. Revisá tu conexión o que el Apps Script esté actualizado.',5000);}
}
function orn(){return'<div class="q-orn"><span></span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0L10 8L8 16L6 8Z" fill="currentColor"/><path d="M0 8L8 6L16 8L8 10Z" fill="currentColor" opacity=".5"/></svg><span></span></div>';}
/* Condiciones: {anticipo} y {validez} se cambian solos. Si alguien escribió el número junto a la palabra
   (ej. "{anticipo}50%"), se quita ese número para que no salga repetido ("5050%"). */
const condFix=t=>String(t||'').replace(/\{anticipo\}\s*\d+(?:[.,]\d+)?\s*%/g,'{anticipo}%').replace(/\d+(?:[.,]\d+)?\s*%?\s*\{anticipo\}/g,'{anticipo}')
  .replace(/\{validez\}\s*\d+/g,'{validez}').replace(/\d+\s*\{validez\}/g,'{validez}');
const condTxt=q=>condFix(q.cond).replace(/\{anticipo\}/g,q.anticipo).replace(/\{validez\}/g,q.validez);
function condWarn(q){if(condFix(q.cond)===String(q.cond||''))return'';

function fitSheet(el,H){

}

function enLetras(c){
  const n=Math.floor(c/100),ct=c%100;
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'],C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const d2=x=>x<30?U[x]:T[Math.floor(x/10)]+(x%10?' y '+U[x%10]:'');
  const d3=x=>x===100?'cien':((C[Math.floor(x/100)]||'')+(x%100?(x>=100?' ':'')+d2(x%100):'')).trim();
  const apoc=w=>w.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const f=x=>{if(!x)return'cero';const mi=Math.floor(x/1e6),k=Math.floor(x/1000)%1000,r=x%1000;let s='';
    if(mi)s+=(mi===1?'un millón':apoc(f(mi))+' millones')+' ';if(k)s+=(k===1?'mil':apoc(d3(k))+' mil')+' ';if(r)s+=d3(r);return s.trim();};
  const w=apoc(f(n));return w[0].toUpperCase()+w.slice(1)+(n>0&&n%1e6===0?' de':'')+(n===1?' lempira':' lempiras')+(ct?' con '+pad(ct)+'/100':(n===1?' exacto':' exactos'));
}

/* Fotos de los artículos: se reducen a 360 px en JPG (unos 15–25 KB) para que la app siga rápida */
function fotoPick(id){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const M=360,k=Math.min(1,M/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
      const url=cv.toDataURL('image/jpeg',0.72);$(id).value=url;$(id+'_v').innerHTML=`<img src="${url}" alt="">`;$(id+'_t').textContent='Cambiar foto';$(id+'_q').hidden=false;};
      img.onerror=()=>toast('No se pudo leer esa imagen');img.src=r.result;};r.readAsDataURL(f);};
  inp.click();
}

/* Lo que lleva el evento: lista para preparar + aviso si no alcanza el inventario ese día */

}
function cotizadoDelDia(fecha,cid,exQ){let t=0;D.cotizaciones.forEach(q=>{if(q.id===exQ||q.eventoId||q.fechaEv!==fecha||!['Borrador','Enviada'].includes(q.estado||'Borrador'))return;q.items.forEach(it=>{if(it.cid===cid)t+=parseFloat(it.cant)||0;});});return t;}

function faltasCot(q){if(!q.fechaEv)return'';const need={};q.items.forEach(it=>{if(it.cid)need[it.cid]=(need[it.cid]||0)+(parseFloat(it.cant)||0);});

function pkDraw(){

const MAXIMG=4,IMGC={},IMGW={};
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const isDrv=r=>typeof r==='string'&&r.startsWith('drv:');
const imgSrc=r=>!r?BLANK:!isDrv(r)?r:(IMGC[r]||BLANK);
const imgTag=(r,a)=>`<img${isDrv(r)?` data-ref="${esc(r)}"`:''} src="${imgSrc(r)}" alt=""${a||''}>`;
function imgLoad(r){
  if(!isDrv(r)||IMGC[r])return Promise.resolve(IMGC[r]||r);
  if(!IMGW[r])IMGW[r]=licCall('img',{fid:r.slice(4)}).then(x=>{
    if(x&&x.ok&&x.data){IMGC[r]='data:'+(x.mime||'image/jpeg')+';base64,'+x.data;document.querySelectorAll('img[data-ref="'+r+'"]').forEach(i=>i.src=IMGC[r]);}
    else delete IMGW[r];return IMGC[r];}).catch(()=>{delete IMGW[r];});
  return IMGW[r];
}
function loadImgsIn(root){if(root)root.querySelectorAll('img[data-ref]').forEach(i=>imgLoad(i.dataset.ref));}
async function prepDoc(args){
  if(args[0]!=='cot')return;const q=getQ(args[1]);
  if(q&&q.imgShow!==false&&(q.imgs||[]).some(r=>isDrv(r)&&!IMGC[r])){toast('Preparando fotos…',0);await Promise.all(q.imgs.map(imgLoad));hideToast();}
}
const imgOwner=(kind,id)=>kind==='cot'?getQ(id):D.proveedores.find(x=>x.id===id);
function imgComprimir(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error('No se pudo leer la foto'));
  fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1000,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',0.7));};
    im.onerror=()=>no(new Error('Ese archivo no es una foto válida'));im.src=fr.result;};fr.readAsDataURL(file);});}
function imgAdd(kind,id){
  const o=imgOwner(kind,id);if(!o)return;if((o.imgs||[]).length>=MAXIMG){toast('Máximo '+MAXIMG+' fotos');return;}
  const inp=$('fileImg');inp.value='';
  inp.onchange=async()=>{
    const o1=imgOwner(kind,id);if(!o1)return;const libres=MAXIMG-(o1.imgs||[]).length,fs=[...inp.files].slice(0,libres);inp.value='';if(!fs.length)return;
    toast(CLOUD?'Subiendo foto…':'Agregando foto…',0);let n=0;
    try{for(const f of fs){const du=await imgComprimir(f);let ref=du;
        if(CLOUD){const r=await licCall('subirImg',{data:du.split(',')[1],mime:'image/jpeg'});
          if(!r||!r.ok||!r.fid)throw new Error((r&&r.msg)||'Para guardar fotos hay que actualizar el Apps Script.');ref='drv:'+r.fid;IMGC[ref]=du;}
        const o2=imgOwner(kind,id);if(!o2)break;o2.imgs=o2.imgs||[];if(o2.imgs.length<MAXIMG){o2.imgs.push(ref);n++;}}
      hideToast();toast(n>1?'✓ Fotos agregadas':'✓ Foto agregada');}
    catch(e){hideToast();toast(e.message&&!/fetch|http|network/i.test(e.message)?e.message:'No se pudo subir la foto. Revisá tu conexión.',5000);}
    if(n){save();render();}
  };
  inp.click();
}
function imgBorrarNube(r){if(CLOUD&&isDrv(r))licCall('borrarImg',{fid:r.slice(4)}).catch(()=>{});}

let ML=null,_wl=null;
const mcFsDef=()=>{try{return +localStorage.getItem('mcFs')||32;}catch(e){return 32;}};
async function wakeOn(){try{if(navigator.wakeLock)_wl=await navigator.wakeLock.request('screen');}catch(e){}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('mcLive'))wakeOn();});
function mcLive(id){

  let el=$('mcLive');if(!el){el=document.createElement('div');el.id='mcLive';el.className='mcl';document.body.appendChild(el);}
  document.body.classList.add('mclive');mcLiveDraw();clearInterval(window._mcT);window._mcT=setInterval(mcTick,500);wakeOn();document.addEventListener('keydown',mcKey);
}
function mcTexto(p,txt){
  const prot=(p.protocolo||[]).length?`</p><ol class="mcl-prot">${p.protocolo.map(x=>`<li><b>${esc(x.nombre)}</b>${x.cargo?`<span>${esc(x.cargo)}</span>`:''}</li>`).join('')}</ol><p>`:'</p><p class="mcl-empty">(Todavía no hay personas en el protocolo)</p><p>';

  const p=mcGet(ML.pid);if(!p){mcLiveClose();return;}

    <div class="mcl-body" id="mcBody" style="font-size:${ML.fs}px">${s.notas?`<div class="mcl-nt">${esc(s.notas)}</div>`:''}${body||'<p class="mcl-empty">Sin guion para esta sección.</p>'}<div style="height:35vh"></div></div>
    <div class="mcl-next"><span>${nx?`Sigue: <b>${esc(nx.titulo)}</b> · ${+nx.min||0} min${nx.resp?' · '+esc(nx.resp):''}`:'<b>Última sección</b>'}</span><span id="mcTot"></span></div>
    <div class="mcl-ctl"><button onclick="mcGo(-1)" aria-label="Sección anterior"${ML.i?'':' style="visibility:hidden"'}>${ic('left',26)}</button>

      <button id="mcRun" onclick="mcRun()" aria-label="Pausar o seguir el cronómetro">${ic(ML.run?'pause':'play',22)}</button>
      <button onclick="mcFrasesVer()" aria-label="Frases de respaldo">${ic('bubble',22)}</button>
      <button class="pri" onclick="mcGo(1)" aria-label="Siguiente sección"${nx?'':' style="visibility:hidden"'}>${ic('right',26)}</button></div>`;
  mcTick();
}
const mmss=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+pad(m):pad(m))+':'+pad(s);};
function mcTick(){
  if(!ML||!$('mcT'))return;const p=mcGet(ML.pid),s=p&&p.secciones[ML.i];if(!s)return;
  const el=ML.acc+(ML.run?Date.now()-ML.t0:0),lim=(+s.min||0)*60000;
  $('mcT').textContent=mmss(el);
  const over=lim>0&&el>lim,warn=lim>0&&!over&&el>lim-60000;
  $('mcTm').className='mcl-tm'+(over?' over':warn?' warn':'');$('mcBarW').className='mcl-bar'+(over?' over':'');
  $('mcBar').style.width=(lim?Math.min(100,el/lim*100):0)+'%';
  $('mcTot').textContent='Programa '+mmss(Date.now()-ML.start)+(over?' · +'+mmss(el-lim)+' extra':'');
}
function mcGo(d){const p=mcGet(ML.pid),j=ML.i+d;if(!p||j<0||j>=p.secciones.length)return;ML.i=j;ML.acc=0;ML.t0=Date.now();ML.run=true;mcLiveDraw();}

function mcFs(d){ML.fs=Math.max(18,Math.min(72,ML.fs+d));try{localStorage.setItem('mcFs',ML.fs);}catch(e){}const b=$('mcBody');if(b)b.style.fontSize=ML.fs+'px';}
function mcAuto(){ML.auto=!ML.auto;const b=$('mcAuto');if(b)b.classList.toggle('on',ML.auto);if(ML.auto){let last=performance.now(),pos=null;
  const step=t=>{if(!ML||!ML.auto)return;const bd=$('mcBody');if(bd){if(pos===null||Math.abs(bd.scrollTop-pos)>2)pos=bd.scrollTop;pos+=(t-last)*ML.fs*0.0011;bd.scrollTop=pos;}last=t;requestAnimationFrame(step);};requestAnimationFrame(step);}}
function mcFrasesVer(){const el=$('mcLive');if(!el)return;const f=document.createElement('div');f.className='mcl-fr';f.onclick=()=>f.remove();
  f.innerHTML=`<div><h3 class="serif">Frases de respaldo</h3>${mcFrases().map(x=>`<p>${esc(x)}</p>`).join('')||'<p>Agregá tus frases en el programa.</p>'}<small>Tocá en cualquier lugar para cerrar</small></div>`;el.appendChild(f);}
function mcKey(e){if(!$('mcLive'))return;const k=e.key;

let PAD={n:0};
function padInit(cv){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));
  const x=cv.getContext('2d');x.scale(d,d);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b2a22';x.fillStyle='#0b2a22';
  PAD={n:0,cv,x,on:false,minX:1e9,minY:1e9,maxX:-1,maxY:-1};
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  const ext=(a,b)=>{PAD.minX=Math.min(PAD.minX,a);PAD.minY=Math.min(PAD.minY,b);PAD.maxX=Math.max(PAD.maxX,a);PAD.maxY=Math.max(PAD.maxY,b);};
  cv.onpointerdown=e=>{e.preventDefault();const pe=$('padErr');if(pe)pe.textContent='';try{cv.setPointerCapture(e.pointerId);}catch(_){}PAD.on=true;const[a,b]=pos(e);PAD.lx=a;PAD.ly=b;x.beginPath();x.arc(a,b,1.3,0,7);x.fill();ext(a,b);};
  cv.onpointermove=e=>{if(!PAD.on)return;e.preventDefault();const[a,b]=pos(e);x.beginPath();x.moveTo(PAD.lx,PAD.ly);x.lineTo(a,b);x.stroke();PAD.lx=a;PAD.ly=b;PAD.n++;ext(a,b);};
  cv.onpointerup=cv.onpointercancel=()=>{PAD.on=false;};
}
function padClear(){if(!PAD.cv)return;PAD.x.clearRect(0,0,PAD.cv.width,PAD.cv.height);Object.assign(PAD,{n:0,minX:1e9,minY:1e9,maxX:-1,maxY:-1});}
function padImg(){
  const cv=PAD.cv,d=window.devicePixelRatio||1,m=8;
  const x0=Math.max(0,(PAD.minX-m)*d),y0=Math.max(0,(PAD.minY-m)*d),x1=Math.min(cv.width,(PAD.maxX+m)*d),y1=Math.min(cv.height,(PAD.maxY+m)*d);
  const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0),k=Math.min(1,480/w,160/h),o=document.createElement('canvas');
  o.width=Math.max(1,Math.round(w*k));o.height=Math.max(1,Math.round(h*k));o.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,o.width,o.height);return o.toDataURL('image/png');
}

async function pdfMulti(sp){
  const k=1.75,cv=await docCanvas(sp,k),T=cv.height/k,brk=(sp._brk||[]).filter(b=>b>0).sort((a,b)=>a-b),pages=[];
  let y=0,first=true;
  while(y<T-4){const room=first?1010:966;let end=Math.min(y+room,T);if(end<T){const c=brk.filter(b=>b>y+260&&b<=end);if(c.length)end=c[c.length-1];}pages.push([y,end,first]);y=end;first=false;}
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:'letter',orientation:'portrait',compress:true});
  pages.forEach(([a,b,f],i)=>{if(i)pdf.addPage();const c=document.createElement('canvas');c.width=cv.width;c.height=Math.round(1056*k);const x=c.getContext('2d');x.fillStyle='#fffdf9';x.fillRect(0,0,c.width,c.height);
    const off=f?0:44;x.drawImage(cv,0,Math.round(a*k),cv.width,Math.round((b-a)*k),0,Math.round(off*k),cv.width,Math.round((b-a)*k));
    pdf.addImage(c.toDataURL('image/jpeg',0.8),'JPEG',0,0,612,792,undefined,'FAST');pdf.setFontSize(8);pdf.setTextColor(150);pdf.text('Página '+(i+1)+' de '+pages.length,306,780,{align:'center'});});
  pdf.setProperties({title:sp.title+' · '+D.negocio});hideToast();await shareOrDl(pdf.output('blob'),sp.file+'.pdf');
}

function helpFilter(q){
  const w=sinAc(q).split(/\s+/).filter(Boolean);let any=0;
  document.querySelectorAll('#hres .hq').forEach(d=>{const a=AYUDA[+d.dataset.i],t=sinAc(a.slice(0,4).flat().join(' '));const ok=w.every(x=>t.includes(x));d.hidden=!ok;if(ok)any++;d.open=!!w.length&&ok&&any<=2;});
  document.querySelectorAll('#hres .hcat').forEach(h=>{let n=h.nextElementSibling,vis=false;while(n&&n.classList.contains('hq')){if(!n.hidden)vis=true;n=n.nextElementSibling;}h.hidden=!vis;});
  $('hnone').hidden=!!any;
}
function helpGo(i){
  const a=AYUDA[i];DL.open&&DL.close();new Function(a[4])();
  if(a[5])setTimeout(()=>{const el=document.querySelector('#main '+a[5].split(',').join(',#main '))||document.querySelector(a[5]);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('hl-pulse');setTimeout(()=>el.classList.remove('hl-pulse'),3400);},350);
  toast('👉 '+a[3][a[3].length>1?1:0],4500);
}

    ${ms?`<button class="btn sm" onclick="S.mes='';render()">Ver todos los meses</button>`:`<button class="btn sm" onclick="S.mes=mesActual();render()">Mes actual</button>`}

  <div class="cards">

    <div class="card"><div class="k">Gastos</div><div class="v neg">${fmt(gas)}</div></div>

  </div>
  ${cr.length?`<div class="panel"><h3>Por categoría</h3><div class="tw"><table><thead><tr><th>Categoría</th><th>Tipo</th><th class="n">Monto</th><th class="n">% del tipo</th></tr></thead><tbody>

function csvIG(){

function difTxt(sb,ref){if(sb==null||isNaN(sb))return'<span class="note">Ingresá el saldo para comparar.</span>';const d=sb-ref;return d===0?'<b class="pos">✓ Cuadra</b>':`<b class="neg">Diferencia: ${fmt(d)}</b>`;}

function bcoAcc(cid,x){

function ctaForm(id){

function delCta(id){const c=D.cuentas.find(x=>x.id===id),n=D.movBco.filter(x=>x.cid===id).length;
  if(!confirm(`¿Eliminar la cuenta "${c.nombre}"?${n?`\nSe borrarán sus ${n} movimientos propios.`:''}\nLos ingresos, gastos, abonos y pagos ligados a ella no se borran, solo quedan sin cuenta.`))return;
  ['ig','movCli','movProv'].forEach(a=>D[a].forEach(x=>{if(x.cid===id)x.cid='';}));

function trfForm(){

function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(name,rows){dl(name,new Blob(['\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');return/[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));}
function exportar(){D.ultimoRespaldo=hoy();save();dl(`respaldo-estado-cuenta-${hoy()}.json`,new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));render();}
function importar(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);
    if(!o||!Array.isArray(o.clientes)||!Array.isArray(o.movCli)||!Array.isArray(o.ig)||!Array.isArray(o.cuentas))throw 0;
    if(!confirm('Esto reemplazará todos los datos actuales con los del respaldo. ¿Continuar?'))return;
    D=Object.assign(blank(),o);numerar();save();go('resumen');alert('Respaldo importado correctamente.');
  }catch(e){alert('El archivo no es un respaldo válido de esta herramienta.');}};
  r.readAsText(file);
}

  if(!r.ok)throw new Error('http '+r.status);return r.json();
}
function licApply(r){if(!r||!r.ok||r.estado==='nuevo')return;LIC.estado=r.estado;if(r.vence)LIC.vence=r.vence;if(r.ahora)LIC.skew=r.ahora-Date.now();if(r.negocio)LIC.negocio=r.negocio;if(r.whatsapp)LIC.wa=r.whatsapp;if('plus' in r)LIC.plus=!!r.plus;LIC.check=Date.now();licSave();}
const licNow=()=>Date.now()+(LIC.skew||0);
const licDias=()=>Math.ceil(((LIC.vence||0)-licNow())/864e5);

/* --- sincronización con la nube --- */
var SY={ver:0,dirty:false,rev:0},BASE='{}',cloudReady=false,CL='ok',_pushT=null,_pushing=false;
const COLS=['clientes','movCli','proveedores','movProv','ig','cuentas','movBco','eventos','cotizaciones','catalogo','paquetes','mc'];
function merge3(base,loc,rem){
  base=base||{};const out=Object.assign({},rem);
  for(const c of COLS){
    const B=new Map((base[c]||[]).map(x=>[x.id,JSON.stringify(x)])),L=new Map((loc[c]||[]).map(x=>[x.id,x])),R=new Map((rem[c]||[]).map(x=>[x.id,x]));
    const arr=[];
    for(const id of new Set([...R.keys(),...L.keys()])){
      const l=L.get(id),r=R.get(id),bs=B.get(id);
      if(l&&r)arr.push(bs!==undefined&&JSON.stringify(l)===bs?r:l);
      else if(l){if(bs===undefined||JSON.stringify(l)!==bs)arr.push(l);}
      else if(r){if(bs===undefined||JSON.stringify(r)!==bs)arr.push(r);}
    }
    out[c]=arr;
  }
  for(const k of Object.keys(loc))if(!COLS.includes(k)&&JSON.stringify(loc[k])!==JSON.stringify(base[k]))out[k]=loc[k];
  for(const k of['recSeq','cpSeq','cotSeq','conSeq'])out[k]=Math.max(loc[k]||0,rem[k]||0);
  return out;
}
function cloudBtn(){if(!CLOUD||!cloudReady)return'';return`<button class="hbtn cl ${CL}" onclick="cloudInfo()" aria-label="Estado de la nube">${ic(CL==='ok'?'cloudok':CL==='off'||CL==='err'?'cloudoff':'cloud',20)}</button>`;}
function cloudSt(st){CL=st;document.querySelectorAll('.hbtn.cl').forEach(b=>{b.className='hbtn cl '+st;b.innerHTML=ic(st==='ok'?'cloudok':st==='off'||st==='err'?'cloudoff':'cloud',20);});}
function cloudInfo(){
  const m={ok:'✓ Todo está guardado en la nube',sync:'Guardando en la nube…',off:'Sin conexión: tus cambios se guardarán al volver el internet',err:'No se pudo guardar en la nube'}[CL];
  if(CL==='ok')toast(m,2500);else toastAct(m,'Reintentar',cloudSync);
}
function cloudMark(){if(!cloudReady)return;SY.dirty=true;SY.rev++;cloudSt('sync');clearTimeout(_pushT);_pushT=setTimeout(cloudPush,1200);}
async function cloudPush(){
  if(!cloudReady||_pushing||!SY.dirty)return;
  _pushing=true;const rev=SY.rev,sent=JSON.stringify(D);
  try{
    let r=await licCall('guardar',{base:SY.ver,data:JSON.parse(sent)});
    if(r&&r.conflicto){
      const now=JSON.stringify(D);D=Object.assign(blank(),merge3(JSON.parse(BASE),JSON.parse(now),r.data||{}));
      const s2=JSON.stringify(D);_last=s2;
      r=await licCall('guardar',{base:r.version,data:JSON.parse(s2)});
      if(r&&r.ok){SY.ver=r.version;BASE=s2;if(SY.rev===rev)SY.dirty=false;render();toast('Se combinaron cambios hechos en otro dispositivo',3500);}
    }else if(r&&r.ok){SY.ver=r.version;BASE=sent;if(SY.rev===rev)SY.dirty=false;}
    else{cloudSt('err');if(r&&r.msg)toast(r.msg,4000);}
  }catch(e){cloudSt('off');}
  _pushing=false;
  if(SY.dirty){clearTimeout(_pushT);_pushT=setTimeout(cloudPush,CL==='off'?15000:800);}else cloudSt('ok');
}
async function cloudSync(){
  if(!cloudReady)return cloudLoad();
  toast('Sincronizando…',0);
  try{const r=await licCall('cargar',{version:SY.ver});licApply(r);
    if(r.ok&&r.data&&r.version>SY.ver){
      if(SY.dirty){D=Object.assign(blank(),merge3(JSON.parse(BASE),JSON.parse(JSON.stringify(D)),r.data));BASE=JSON.stringify(r.data);SY.ver=r.version;_last=JSON.stringify(D);SY.rev++;}
      else{D=Object.assign(blank(),r.data);SY.ver=r.version;BASE=JSON.stringify(D);_last=BASE;}
      render();
    }
    if(SY.dirty)await cloudPush();
    hideToast();toast(SY.dirty?'Sin conexión: se reintentará solo':'✓ Todo está guardado en la nube',2500);
  }catch(e){hideToast();cloudSt('off');toast('Sin conexión a internet',3000);}
  licUI();
}
function cargarCuenta(r){
  licApply(r);D=Object.assign(blank(),r.data||{});SY={ver:r.version||0,dirty:false,rev:0};
  BASE=JSON.stringify(D);_last=BASE;cloudReady=true;CL='ok';
  numerar();save();
  S.tab='resumen';S.sel=null;render();licUI();
  setTimeout(()=>pubSync(true),2500);setTimeout(novCheck,1500);
  if(r.tienePin===false)setTimeout(licPinForm,600);
}
async function cloudLoad(){
  gate('cargando');
  try{
    const r=await licCall('cargar',{version:-1});
    if(r.ok&&r.estado==='nuevo'){LIC={id:newId()};licSave();gate('bienvenida');return;}
    if(!r.ok)throw new Error(r.msg||'error');
    cargarCuenta(r);
  }catch(e){gate('offline');}
}
async function licInit(){
  if(!CLOUD||!cloudReady)return;
  try{const r=await licCall('estado',{});licApply(r);}catch(e){}
  licUI();
}

/* --- pantallas de acceso --- */
function gate(modo){
  const lk=$('licLock');document.body.classList.add('locked');$('licBar').hidden=true;
  const pie='<div class="lk-id">Sistema creado por José Vicdonio Molina</div>';
  if(modo==='cargando')lk.innerHTML=`<div class="lk-card"><div class="mono serif spin">✦</div><h2 class="serif">${esc(LIC.negocio||'Cargando')}</h2><p>Cargando tus datos…</p></div>`;
  else if(modo==='offline')lk.innerHTML=`<div class="lk-card"><div class="mono serif">✦</div><h2 class="serif">Sin conexión</h2><p>Este sistema funciona en línea. Revisá tu conexión a internet e intentá de nuevo.</p><button class="btn gold" onclick="cloudLoad()">Reintentar</button>${pie}</div>`;
  else if(modo==='ingresar')lk.innerHTML=`<div class="lk-card"><div class="mono serif">✦</div><h2 class="serif">Ingresar</h2><p>Entrá con el WhatsApp y el PIN de tu cuenta.</p>
    <label class="fld"><span>WhatsApp</span><input id="gWa" inputmode="tel" placeholder="9999-9999" autocomplete="tel"></label>
    <label class="fld"><span>PIN</span><input id="gPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="current-password"></label>
    <div class="lk-err" id="gErr"></div><button class="btn gold" id="gGo" onclick="licIngresar()">Ingresar</button>
    <button class="btn ghost" onclick="gate('bienvenida')">¿No tenés cuenta? Probá gratis 7 días</button>${pie}</div>`;
  else lk.innerHTML=`<div class="lk-card"><div class="mono serif">✦</div><h2 class="serif">Bienvenido</h2><p>Probá todas las funciones gratis durante <b>7 días</b>: eventos, cotizaciones, recibos, estados de cuenta y más.</p>
    <label class="fld"><span>Nombre de tu negocio</span><input id="gNeg" autocomplete="organization"></label>
    <label class="fld"><span>Tu WhatsApp</span><input id="gWa" inputmode="tel" placeholder="9999-9999" autocomplete="tel"></label>
    <label class="fld"><span>Creá un PIN de 4 a 6 números (para entrar desde otro equipo)</span><input id="gPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="new-password"></label>
    <div class="lk-err" id="gErr"></div><button class="btn gold" id="gGo" onclick="licEmpezar()">Comenzar prueba gratis</button>
    <button class="btn ghost" onclick="gate('ingresar')">Ya tengo cuenta · Ingresar</button>${pie}</div>`;
  lk.hidden=false;
}
function gErr(m){$('gErr').textContent=m;}
function gBusy(t){const b=$('gGo');b.disabled=!!t;b.dataset.l=b.dataset.l||b.textContent;b.textContent=t||b.dataset.l;}
async function licEmpezar(){
  const n=$('gNeg').value.trim(),w=$('gWa').value.trim(),p=$('gPin').value.trim();
  if(!n)return gErr('Escribí el nombre de tu negocio');
  if(w.replace(/\D/g,'').length<8)return gErr('Escribí tu número de WhatsApp');
  if(!/^\d{4,6}$/.test(p))return gErr('El PIN debe tener de 4 a 6 números');
  gBusy('Creando tu cuenta…');
  try{
    const ini=blank();ini.negocio=n;
    const r=await licCall('registrar',{negocio:n,whatsapp:w,pin:p,data:ini});
    if(!r.ok)throw new Error(r.msg||'error');
    LIC.wa=w;cargarCuenta(r);toast('¡Bienvenido! Tenés 7 días de prueba gratis ✨',4000);
  }catch(e){gBusy('');gErr(e.message&&e.message!=='Failed to fetch'&&!/http/.test(e.message)?e.message:'Necesitás internet para crear tu cuenta.');}
}
async function licIngresar(){
  const w=$('gWa').value.trim(),p=$('gPin').value.trim();
  if(w.replace(/\D/g,'').length<8)return gErr('Escribí tu número de WhatsApp');
  if(!/^\d{4,6}$/.test(p))return gErr('Escribí tu PIN');
  gBusy('Ingresando…');
  try{const r=await licCall('ingresar',{whatsapp:w,pin:p});
    if(!r.ok){gBusy('');return gErr(r.msg||'No se pudo ingresar');}
    LIC={id:r.id,wa:w};licSave();cargarCuenta(r);toast('¡Hola de nuevo! ✨',2500);
  }catch(e){gBusy('');gErr('Sin conexión a internet.');}
}
function licLogout(){
  if(SY.dirty&&!confirm('Hay cambios que todavía no se guardaron en la nube. ¿Cerrar sesión de todas formas?'))return;
  if(!SY.dirty&&!confirm('¿Cerrar sesión en este equipo? Tus datos quedan guardados en la nube.'))return;
  LIC={id:newId()};licSave();cloudReady=false;D=blank();_last='';SY={ver:0,dirty:false,rev:0};
  render();gate('ingresar');
}
function licPinForm(){
  form('Protegé tu cuenta con un PIN',[{n:'pin',l:'Creá un PIN de 4 a 6 números para entrar desde otro equipo',t:'password',req:1}],null,v=>{
    if(!/^\d{4,6}$/.test(v.pin)){$('ferr').textContent='El PIN debe tener de 4 a 6 números';return false;}
    licCall('pin',{pin:v.pin}).then(r=>toast(r.ok?'✓ PIN guardado':'No se pudo guardar el PIN',3000)).catch(()=>toast('Sin conexión',3000));
  });
}
function licActForm(){form('Activar licencia de por vida',[{n:'clave',l:'Contraseña de activación',t:'password',req:1}],null,v=>{licActivar(v.clave);});}
async function licActivar(clave){
  toast('Verificando…',0);
  try{const r=await licCall('activar',{clave});
    if(r.ok){licApply(r);toast('✓ Licencia activada de por vida. ¡Gracias!',5000);}else toast(r.msg||'No se pudo activar',5000);
  }catch(e){toast('Sin conexión a internet.',5000);}
  licUI();render();
}
async function licCheck(){toast('Verificando…',0);await licInit();hideToast();
  toast(LIC.estado==='activa'?'✓ Licencia activa de por vida':'Todavía no está activada. Si ya pagaste, escribinos por WhatsApp.',4500);render();}
function licUI(){
  if(!CLOUD||!cloudReady)return;
  const bar=$('licBar'),lk=$('licLock');
  const d=licDias(),bloq=LIC.estado==='bloqueada'||(LIC.estado==='prueba'&&d<=0);
  if(bloq){
    const msg=encodeURIComponent(`Hola, quiero activar mi licencia del sistema de eventos.\nNegocio: ${LIC.negocio||D.negocio}\nCódigo: ${licCod()}`);
    lk.innerHTML=`<div class="lk-card"><div class="mono serif">✦</div><h2 class="serif">${LIC.estado==='bloqueada'?'Acceso suspendido':'Tu prueba terminó'}</h2>
      <p>Tus datos están guardados y seguros en la nube. Para seguir usando el sistema <b>de por vida</b>, activá tu licencia.</p>
      <a class="btn wa" href="https://wa.me/${LIC_WA}?text=${msg}" target="_blank" rel="noopener">${ic('send',18)} Solicitar activación por WhatsApp</a>
      <button class="btn gold" onclick="licActForm()">Activar con contraseña</button>
      <button class="btn" onclick="licCheck()">Ya pagué · verificar</button>
      <button class="btn ghost" onclick="exportar()">Descargar copia de mis datos</button>
      <div class="lk-id">Código de cuenta: <b>${licCod()}</b></div></div>`;
    lk.hidden=false;
  }else lk.hidden=true;
  document.body.classList.toggle('locked',bloq);
  const tr=LIC.estado==='prueba'&&!bloq;bar.hidden=!tr;document.body.classList.toggle('trial',tr);
  if(tr)bar.innerHTML=`<span class="lb-dot"></span><span><b>Versión de prueba</b> · ${d<=1?'último día':`vence en ${d} días`}</span><button onclick="licActForm()">Activar</button>`;
}
addEventListener('beforeunload',e=>{if(CLOUD&&SY.dirty){e.preventDefault();e.returnValue='';}});
addEventListener('online',()=>{if(CLOUD&&cloudReady){if(SY.dirty)cloudPush();licInit();}});
function licPanel(){
  if(!CLOUD)return'';
  const d=licDias(),st=LIC.estado==='activa'?'<b class="pos">Activa de por vida</b>':LIC.estado==='prueba'?(d>0?`<b>Versión de prueba</b> · vence en ${d} día${d===1?'':'s'}`:'<b class="neg">Prueba vencida</b>'):'<b class="neg">'+esc(LIC.estado||'Sin registrar')+'</b>';
  return`<div class="panel"><h3>Licencia</h3><p style="margin:0 0 6px">${st}</p><p class="note">Código de cuenta: <b>${licCod()}</b></p>
    <div class="row"><button class="btn" onclick="licCheck()">Verificar estado</button>${LIC.estado!=='activa'?'<button class="btn gold" onclick="licActForm()">Activar</button>':''}</div>
    <p style="margin:16px 0 6px"><span class="badge au">Plus</span> Maestro de ceremonia: ${isPlus()?'<b class="pos">Activo</b>':'<b>No activado</b>'}</p>
    ${isPlus()?'':`<div class="row"><button class="btn" onclick="plusCheck()">Verificar Plus</button><button class="btn gold" onclick="plusActForm()">Activar Plus</button></div>`}</div>`;
}

/* ===== Aviso de versión nueva (para la app instalada y la web) ===== */
const APP_VER='2026.10.22-4';
let _verT=0;
async function verCheck(){
  if(PUBT)return;if(Date.now()-_verT<60000)return;_verT=Date.now();
  try{const r=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER)toastAct('✨ Hay una versión nueva de la app','Actualizar',()=>{if(CLOUD&&SY.dirty){cloudPush();setTimeout(()=>location.reload(),2500);}else location.reload();});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')verCheck();});
setInterval(verCheck,30*60000);setTimeout(verCheck,8000);
S.mes=mesActual();
if(PUBT)pubInit();
else if(CLOUD){render();if(LIC.estado)cloudLoad();else gate('bienvenida');setInterval(licInit,6*36e5);}
else{numerar();save();render();setTimeout(novCheck,1200);}
setTimeout(()=>{if(navigator.onLine)loadLib('h2c');},1500);
</script>
